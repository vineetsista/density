[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "density"
# Single-sourced from the package: __version__ is stamped into every store
# manifest and every benchmark result file, so a release that bumped only
# one of the two would sign stores with a version that never existed.
dynamic = ["version"]
description = "The flight recorder for AI agents: recall-guaranteed storage tiers for traces and embeddings."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vineet Sista", email = "vineet.sista@gmail.com" }]
requires-python = ">=3.11"
keywords = [
    "agents",
    "observability",
    "compression",
    "vector-search",
    "quantization",
    "product-quantization",
    "embeddings",
    "recall",
    "zstd",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Archiving :: Compression",
    "Topic :: Database :: Database Engines/Servers",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "pyarrow>=15.0",
    "zstandard>=0.22",
    "pydantic>=2.6",
    "typer>=0.12",
    "jinja2>=3.1",
]

[project.optional-dependencies]
accel = [
    # The accel extra only supplies build-time dependencies. Kernels are
    # compiled lazily on first import and cached; see
    # src/density/engine/_accel/build.py.
    "pybind11>=2.12",
]
service = [
    # Only `density serve` needs a web framework. The core library opens no
    # sockets, so a plain install does not pull one in; see DECISIONS item 35.
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
dev = [
    "density[accel,service]",
    "pytest>=8.0",
    "hypothesis>=6.98",
    "httpx>=0.27",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/vineetsista/density"
Repository = "https://github.com/vineetsista/density"
Issues = "https://github.com/vineetsista/density/issues"
Changelog = "https://github.com/vineetsista/density/blob/main/CHANGELOG.md"

[project.scripts]
density = "density.cli:main"

[tool.hatch.version]
path = "src/density/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/density"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "scratch"]

[tool.ruff.lint]
# A: shadowing a builtin (density.open is a deliberate, suppressed case).
# RUF100: an unused noqa is itself a lint error, so suppressions cannot rot.
select = ["E", "F", "I", "A", "B", "UP", "RUF100"]
ignore = [
    # Long lines are allowed in prose blocks; the formatter is not run over
    # this repo, and reflowing measured tables would hurt readability.
    "E501",
    # zip(..., strict=True) would raise where the pairing is deliberately
    # over the shorter side. Worth revisiting per call site, not in bulk.
    "B905",
    # Tier is contracted as `class Tier(str, Enum)` in
    # docs/design/00-contracts.md. StrEnum changes str(Tier.HOT), which is
    # visible in manifests and report text.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# typer declares options as call defaults; that is the framework's API.
"src/density/cli.py" = ["B008"]
# Gate scripts put the repo on sys.path before importing their helper.
"scripts/*" = ["E402"]
