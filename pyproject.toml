[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "density"
version = "0.1.0"
description = "The flight recorder for AI agents: recall-guaranteed storage tiers for traces and embeddings."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Vineet Sista", email = "vineet.sista@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pyarrow>=15.0",
    "zstandard>=0.22",
    "pydantic>=2.6",
    "typer>=0.12",
    "jinja2>=3.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
accel = [
    # The accel extra only supplies build-time dependencies. Kernels are
    # compiled lazily on first import and cached; see src/density/_accel.
    "pybind11>=2.12",
]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.98",
    "httpx>=0.27",
]

[project.scripts]
density = "density.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/density"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
